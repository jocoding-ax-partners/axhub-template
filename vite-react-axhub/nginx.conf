# SPA fallback — 새로고침/딥링크에도 클라이언트 라우팅이 동작하도록
# 매칭 안 되는 경로는 index.html 로 떨군다.
server {
  listen 80;
  server_name _;

  # 사용자 신원 — axhub 문(ingress 게이트)이 통과시킨 요청마다 X-AxHub-* 헤더를 이 파드에 실어요.
  # 브라우저는 그 요청 헤더를 볼 수 없으니, 여기서 JSON 으로 되돌려 줘요 (src/lib/axhub.ts 의 me() 가 읽음).
  # 파드 안에서 끝나요 — 허브 API 호출 0. 값은 문이 매 요청 덮어쓰므로 위조할 수 없어요.
  # 익명(로그인 안 함)이면 전부 빈 문자열 — 오류가 아니라 정상 상태예요.
  # email/name 은 base64(UTF-8) 그대로 넘기고 브라우저에서 디코드해요.
  location = /__axhub/me {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"user_id":"$http_x_axhub_user_id","email_b64":"$http_x_axhub_user_email","name_b64":"$http_x_axhub_user_name","app_role":"$http_x_axhub_app_role","is_admin":"$http_x_axhub_is_admin","tenant_slug":"$http_x_axhub_tenant_slug","surface":"$http_x_axhub_surface"}';
  }

  location / {
    root   /usr/share/nginx/html;
    index  index.html;
    try_files $uri $uri/ /index.html;
  }
}

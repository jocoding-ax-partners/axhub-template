version: axhub/v1
name: idea-hr-notice-read
# 공지와 읽음 확인을 저장하는 전용 PostgreSQL. 배포하면 axhub 가 DB 를 만들고
# DATABASE_URL / DIRECT_DATABASE_URL 을 자동으로 넣어 줘요. 테이블은 앱이 처음 쓸 때 만들어요 (lib/db.ts).
database:
  engine: postgres
runtime:
  port: 3000
  health_path: /healthz
build:
  strategy: auto
  framework: nextjs
  dockerfile: Dockerfile
  deploy_method: docker
env:
  optional:
    - name: APPHUB_API_URL
      scope: runtime
    - name: APPHUB_APP_SLUG
      scope: runtime
    - name: APPHUB_TENANT
      scope: runtime

# 배포 전 검사. 디자인 토큰 규칙을 어기면 여기서 걸려요.
ci:
  commands:
    - bash scripts/check-design.sh

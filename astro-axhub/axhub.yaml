version: axhub/v1
name: astro-axhub
# DB 가 필요하면 아래 주석을 해제하세요. 배포 시 전용 PostgreSQL 을 발급하고
# DATABASE_URL / DIRECT_DATABASE_URL 을 파드에 자동 주입해요.
# database:
#   engine: postgres
runtime:
  port: 3000
  health_path: /healthz
build:
  strategy: auto
  framework: node
  dockerfile: Dockerfile
  deploy_method: docker
env:
  optional:
    - name: APPHUB_API_URL
      scope: runtime
    - name: APPHUB_APP_SLUG
      scope: runtime
    - name: APPHUB_TENANT
      scope: runtime

# 배포 전 검사. 디자인 토큰 규칙을 어기면 여기서 걸려요.
ci:
  commands:
    - bash scripts/check-design.sh

version: axhub/v1
name: idea-ops-room-booking
# 회의실·예약을 저장할 전용 PostgreSQL. 배포 시 발급하고
# DATABASE_URL / DIRECT_DATABASE_URL 을 파드에 자동 주입해요.
# btree_gist 는 "겹치는 예약 막기" DB 제약(lib/db.ts)에 필요해요 — 지우지 마세요.
database:
  engine: postgres
  extensions: [btree_gist]
runtime:
  port: 3000
  health_path: /healthz
build:
  strategy: auto
  framework: nextjs
  dockerfile: Dockerfile
  deploy_method: docker
env:
  optional:
    - name: APPHUB_API_URL
      scope: runtime
    - name: APPHUB_APP_SLUG
      scope: runtime
    - name: APPHUB_TENANT
      scope: runtime

# 배포 전 검사. 디자인 토큰 규칙을 어기면 여기서 걸려요.
ci:
  commands:
    - bash scripts/check-design.sh

version: axhub/v1
name: idea-marketing-event-signup
# 이벤트·신청자·출석 기록을 저장하는 전용 PostgreSQL. 배포 시 axhub 가 발급하고
# DATABASE_URL / DIRECT_DATABASE_URL 을 파드에 자동 주입해요. 테이블은 lib/db.ts 가 처음 쓸 때 만들어요.
database:
  engine: postgres
runtime:
  port: 3000
  health_path: /healthz
build:
  strategy: auto
  framework: nextjs
  dockerfile: Dockerfile
  deploy_method: docker
env:
  optional:
    - name: APPHUB_API_URL
      scope: runtime
    - name: APPHUB_APP_SLUG
      scope: runtime
    - name: APPHUB_TENANT
      scope: runtime

# 배포 전 검사. 디자인 토큰 규칙을 어기면 여기서 걸려요.
ci:
  commands:
    - bash scripts/check-design.sh
